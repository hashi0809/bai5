<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bài 5</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <aside>
      <ul>
        <li class="color">
          <img src="image/element-4.svg" alt="Dashboard" />
        </li>
        <li>
          <img src="image/graph.svg" alt="Graph" />
        </li>
        <li>
          <img src="image/medal-star.svg" alt="Medal" />
        </li>
        <li>
          <img src="image/messages.svg" alt="Messages" />
        </li>
        <li>
          <img src="image/setting-2.svg" alt="Settings" />
        </li>
      </ul>
    </aside>

    <div class="container">
      <div class="header">
        <div class="sub-header">
          <div class="first">
            <div class="top">Welcome, Amanda</div>
            <div class="common">Tue, 07 June 2022</div>
          </div>

          <div class="header-right">
            <div class="search-box">
              <img src="image/search-normal.svg" alt="Search" />
              <input type="text" placeholder="Search" />
            </div>
            <button class="notif-btn" aria-label="Notifications">
              <img src="image/notification-bing.svg" alt="Notifications" />
            </button>
            <img
              class="avatar-mini"
              src="image/Rectangle 1072.svg"
              alt="User avatar"
            />
          </div>
        </div>
      </div>

      <div class="profile-card">
        <img class="banner" src="image/Rectangle 6691.svg" alt="Banner" />

        <div class="profile-header">
          <img class="avatar" src="image/Ellipse 11.svg" alt="Alexa Rawles" />
          <div class="profile-info">
            <h2>Alexa Rawles</h2>
            <p>alexarawles@gmail.com</p>
          </div>
          <button type="button" class="btn-edit">Edit</button>
        </div>

        <form class="form-grid" onsubmit="event.preventDefault()">
          <div class="form-group">
            <label for="fullname">Full Name</label>
            <input id="fullname" type="text" placeholder="Your First Name" />
          </div>

          <div class="form-group">
            <label for="nickname">Nick name</label>
            <input id="nickname" type="text" placeholder="Your Nick Name" />
          </div>

          <div class="form-group">
            <label for="gender">Gender</label>
            <div class="select-wrapper">
              <select id="gender" required>
                <option value="" disabled selected>Your Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="LGBT">LGBT</option>
              </select>
              <img class="select-arrow" src="image/arrow-down.svg" alt="" />
            </div>
          </div>

          <div class="form-group">
            <label for="country">Country</label>
            <div class="select-wrapper">
              <select id="country" required>
                <option value="" disabled selected>Your Country</option>
                <option value="vn">Vietnam</option>
                <option value="us">USA</option>
              </select>
              <img class="select-arrow" src="image/arrow-down.svg" alt="" />
            </div>
          </div>

          <div class="form-group">
            <label for="language">Language</label>
            <div class="select-wrapper">
              <select id="language" required>
                <option value="" disabled selected>Your Language</option>
                <option value="vi">Vietnamese</option>
                <option value="en">English</option>
              </select>
              <img class="select-arrow" src="image/arrow-down.svg" alt="" />
            </div>
          </div>

          <div class="form-group">
            <label for="timezone">Time Zone</label>
            <div class="select-wrapper">
              <select id="timezone" required>
                <option value="" disabled selected>Your Time Zone</option>
                <option value="gmt7">GMT+7</option>
                <option value="gmt8">GMT+8</option>
              </select>
              <img class="select-arrow" src="image/arrow-down.svg" alt="" />
            </div>
          </div>
        </form>

        <div class="email-section">
          <h3>My email Address</h3>

          <div class="email-item">
            <div class="icon-circle">
              <img src="image/sms.svg" alt="Email" />
            </div>
            <div class="email-info">
              <p class="email-text">alexarawles@gmail.com</p>
              <span class="email-time">1 month ago</span>
            </div>
          </div>

          <button type="button" class="btn-add-email">
            +Add Email Address
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
